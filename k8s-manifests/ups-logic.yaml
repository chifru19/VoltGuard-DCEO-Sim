apiVersion: apps/v1
kind: Deployment
metadata:
  name: ups-logic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ups
  template:
    metadata:
      labels:
        app: ups
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ups-logic-engine
        image: ups-logic:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MQTT_BROKER
          value: "mqtt-service"
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"
          requests:
            cpu: "250m"
            memory: "64Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 10
          periodSeconds: 20